<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bandary 聽團曆</title>
<meta name="description" content="Bandary 聽團曆：記錄看過的演唱會與音樂祭、追蹤台灣的免費活動、看見自己這幾年的場次與花費。Android App 與網頁版共用同一份資料。">
<link rel="canonical" href="https://bandary.web.app/">
<meta property="og:title" content="Bandary 聽團曆">
<meta property="og:description" content="記錄看過的演唱會與音樂祭、追蹤台灣的免費活動、看見自己這幾年的場次與花費。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bandary.web.app/">
<meta property="og:image" content="https://bandary.web.app/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="manifest" href="manifest.json">
<!-- 分頁 favicon：SVG 優先（各尺寸都清晰），舊瀏覽器退回 PNG；apple-touch-icon 給 iOS 加到主畫面用 -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#F4F7F6">
<style>
  /* 色票由 Theme.kt 的 lightFor / darkFor(GREEN_PALETTE) 推導而來。
     那些值是在 Oklab 空間內插算出來的，不是隨手挑的灰階——用 sRGB 硬算會明顯偏色，
     所以這裡寫死算好的結果，不要「看起來差不多」地自己調。
     預設淺色。 */
  :root{
    --primary:#6B9080; --on-primary:#FFFFFF;
    --primary-container:#CCE3DE; --on-primary-container:#223A31;
    --secondary:#52776A; --secondary-container:#E3EAE7;
    --background:#F4F7F6; --on-background:#040706;
    --surface:#FAFBFA; --on-surface:#040706;
    --surface-variant:#E8EEEB; --on-surface-variant:#22312B;
    --surface-container:#F1F5F3; --surface-container-high:#E9EFEC;
    --outline:#7A8C84; --outline-variant:#D1DDD7;
    --error:#BA1A1A;
    --shadow:#0002;
  }
  :root{
    /* 圖表色：莫蘭迪系，飽和度壓低才不會在安靜的版面上尖叫。
       每張圖一個主色（不是每根長條一個色）——同一張圖裡換色會讓人誤以為顏色代表分類。 */
    --c1:#6B9080; --c2:#6F9BC4; --c3:#CE8BA6;
    --c4:#B08968; --c5:#8C8BB0; --c6:#5E8C84;
  }
  :root[data-theme="dark"]{
    /* 深色底要提高明度，否則低飽和的莫蘭迪色會整片沉進背景（同上，向白 Oklab 混 0.4 拉亮）。 */
    --c1:#A4C3B2; --c2:#9BBEDF; --c3:#E4AEC3;
    --c4:#D0AC8A; --c5:#AFAED0; --c6:#8FB8B1;
    --primary:#A4C3B2; --on-primary:#15281F;
    --primary-container:#3A574C; --on-primary-container:#CCE3DE;
    --secondary:#B6CFC1; --secondary-container:#1A201D;
    --background:#000000; --on-background:#EDF3EF;
    --surface:#000000; --on-surface:#EEF4F1;
    --surface-variant:#0A0E0C; --on-surface-variant:#D8E6DE;
    --surface-container:#010201; --surface-container-high:#050706;
    --outline:#99ABA1; --outline-variant:#27302B;
    --error:#FFB4AB;
    --shadow:#000c;
  }
  :root{
    /* 形狀：App 的 BandaryShapes 是方塊化的 0 / 2 / 4dp，不是圓角卡片。 */
    --r-sm:0px; --r-md:2px; --r-lg:4px;
    /* 間距：對應 Theme.kt 的 Spacing */
    --sp-xs:4px; --sp-sm:8px; --sp-md:12px; --sp-lg:16px; --sp-xl:20px; --sp-xxl:24px;
    /* 字體：大標襯線（雜誌 / 編輯風），資訊與標籤用單線 sans——與 BandaryTypography 一致 */
    --serif:"Noto Serif TC",Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",Roboto,sans-serif;
  }
  :root{
    /* 雜誌風的排版尺度：字級落差要大，正文才顯得安靜、標題才有份量。
       行高一律給足（CJK 至少 1.5），字被削底是最廉價的破綻。 */
    --t-display:36px;  --lh-display:46px;   /* 版面大標 */
    --t-title:21px;    --lh-title:31px;     /* 卡片標題 */
    --t-body:16px;     --lh-body:25px;      /* 正文：手機上 14 太小，16 才好讀 */
    --t-meta:14px;     --lh-meta:21px;
    --t-label:12px;    --lh-label:17px;     /* 小標籤，靠字距拉開而不是縮小 */
    --ls-label:1.4px;
  }
  *{box-sizing:border-box}
  /* 必須放在所有 display 規則之前並加 !important：瀏覽器的 [hidden] 只是 UA 樣式的
     display:none，被作者端的 .fab{display:flex} / .center{display:flex} 蓋過去，
     結果就是「已經設 hidden 了卻還看得到」。 */
  [hidden]{display:none !important}
  html,body{margin:0;background:var(--background);color:var(--on-background)}
  body{font-family:var(--sans);font-size:var(--t-body);line-height:var(--lh-body);-webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;overflow-x:hidden}
  /* 保險：不管哪裡塞進一段沒有空白可斷的長字串（網址、代碼…），都不該把整頁往右推開。
     上面這行擋住「整頁橫向捲動」的最終結果；下面這行從源頭讓文字自己換行，兩層一起防。 */
  h1,h2,h3,b,.t,.meta{overflow-wrap:anywhere}

  /* TopAppBar：surface 底、粗體標題 */
  /* 標題列不畫底線：雜誌版面靠留白分段，一條線只會把版面切碎 */
  header{position:sticky;top:0;z-index:10;background:var(--background);
    padding:0 var(--sp-xl);padding-top:env(safe-area-inset-top)}
  .appbar{display:flex;align-items:baseline;gap:var(--sp-md);
    padding:var(--sp-xl) 0 var(--sp-md)}
  h1{font-family:var(--serif);font-weight:700;
    font-size:var(--t-display);line-height:var(--lh-display);
    letter-spacing:-.5px;margin:0}
  .grow{flex:1}

  main{padding:var(--sp-xxl) var(--sp-xl);
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
    max-width:680px;margin:0 auto}

  /* 卡片：App 的深色 surface 與 background 幾乎同色，層次靠 surfaceVariant 與外框細線 */
  /* 條目：沒有底色與外框，只用一條髮絲線分隔——框線越少版面越安靜 */
  .card{background:transparent;border:none;border-bottom:1px solid var(--outline-variant);
    border-radius:0;padding:var(--sp-lg) 0;margin:0;cursor:pointer}
  .card:last-child{border-bottom:none}
  .card h3{margin:0;font-family:var(--serif);font-weight:700;
    font-size:var(--t-title);line-height:var(--lh-title);letter-spacing:-.2px}
  .meta{color:var(--on-surface-variant);font-size:var(--t-meta);line-height:var(--lh-meta)}
  .card .meta{margin-top:6px}
  /* labelSmall：10sp/14sp + letterSpacing .8 */
  /* 標籤不做成小方塊：字距拉開的小字本身就夠像標籤，也不會在版面上戳出一堆色塊 */
  .tag{display:inline-block;background:transparent;border:none;padding:0;
    color:var(--on-surface-variant);font-size:var(--t-label);line-height:var(--lh-label);
    letter-spacing:var(--ls-label);margin-right:var(--sp-md);text-transform:uppercase}

  /* labelLarge：Sans W600 13sp + letterSpacing .4 */
  button{font-family:inherit}
  .btn{background:var(--on-surface);color:var(--background);border:none;border-radius:0;
    padding:13px 26px;font-size:var(--t-label);line-height:var(--lh-label);
    letter-spacing:var(--ls-label);font-weight:600;text-transform:uppercase;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--outline);color:var(--on-surface)}
  .link{background:none;border:none;color:var(--primary);font-size:13px;letter-spacing:.4px;
    font-weight:600;cursor:pointer;padding:var(--sp-sm) 0}
  .danger{background:none;border:none;color:var(--error);font-size:13px;font-weight:600;
    cursor:pointer;padding:var(--sp-sm) 0}

  /* ExtendedFAB：App 的形狀是方的（extraLarge = 4dp） */
  /* FAB 用墨色而非主色：主色留給真正需要被看見的地方（今天、選取） */
  .fab{position:fixed;right:var(--sp-xl);bottom:calc(80px + env(safe-area-inset-bottom));
    background:var(--on-surface);color:var(--background);border:none;border-radius:0;
    height:46px;padding:0 var(--sp-xl);font-size:var(--t-label);
    letter-spacing:var(--ls-label);font-weight:600;text-transform:uppercase;
    cursor:pointer;box-shadow:0 2px 16px var(--shadow);
    display:flex;align-items:center;gap:var(--sp-sm);z-index:9}

  /* NavigationBar：與 App 底部導覽同一組項目與順序 */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;
    background:var(--background);border-top:1px solid var(--outline-variant);
    padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:none;color:var(--on-surface-variant);
    display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:var(--sp-sm) 0 10px;cursor:pointer;font-size:11px;line-height:15px;letter-spacing:.8px}
  nav button svg{width:24px;height:24px;fill:currentColor}
  nav button[aria-selected="true"]{color:var(--on-surface)}
  .ind{display:flex;align-items:center;justify-content:center;
    width:56px;height:28px;transition:opacity .15s;opacity:.55}
  nav button[aria-selected="true"] .ind{opacity:1}
  nav button{letter-spacing:var(--ls-label);text-transform:uppercase}

  dialog{border:none;border-radius:0;background:var(--background);
    color:var(--on-surface);width:min(560px,94vw);padding:0;max-height:90vh;
    border:1px solid var(--on-surface)}
  dialog::backdrop{background:#0009}
  .dlg-body{padding:var(--sp-xl);overflow-y:auto;max-height:70vh}
  /* titleMedium：Sans W600 16sp/24sp */
  .dlg-body h3{margin:0 0 var(--sp-md);font-family:var(--serif);
    font-size:24px;line-height:34px;font-weight:700;letter-spacing:-.3px}
  .dlg-foot{display:flex;gap:var(--sp-sm);justify-content:flex-end;
    padding:var(--sp-md) var(--sp-xl);border-top:1px solid var(--outline-variant)}
  /* labelMedium：11sp + letterSpacing .6 */
  label{display:block;margin:var(--sp-xl) 0 0;font-size:var(--t-label);line-height:var(--lh-label);
    letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--on-surface-variant)}
  /* 輸入框只留底線：四邊框在一堆欄位並排時會變成一格一格的網格，很吵 */
  input,select,textarea{width:100%;background:transparent;border:none;
    border-bottom:1px solid var(--outline-variant);color:var(--on-surface);
    border-radius:0;padding:8px 0;font:inherit;font-size:var(--t-body)}
  input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--on-surface)}
  /* 勾選方塊不能吃整列寬度：套到 width:100% 會把同一列的文字擠成一行一個字 */
  input[type=checkbox],input[type=radio]{width:18px;height:18px;flex:none;
    border:none;padding:0;margin:0;accent-color:var(--primary)}
  textarea{min-height:72px;resize:vertical}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-md)}

  /* 批次匯入預覽列 */
  #bkList{max-height:34vh;overflow-y:auto;margin-top:var(--sp-sm)}
  .bk-row{display:flex;align-items:center;gap:var(--sp-md);margin:0;padding:8px 0;
    border-bottom:1px solid var(--outline-variant);cursor:pointer}
  .bk-row:last-child{border-bottom:none}
  .bk-row input[type=checkbox]{width:18px;height:18px;flex:none;border:none;
    padding:0;margin:0;accent-color:var(--primary)}
  .bk-t{flex:1;min-width:0}
  .bk-t b{display:block;font-size:14px;font-weight:600;line-height:20px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bk-t .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bk-err b{color:var(--error)}
  .bk-dup{flex:none;font-size:10px;letter-spacing:.4px;color:var(--on-surface-variant);
    border:1px solid var(--outline-variant);padding:2px 6px}

  /* 統計頁頁首：三個入口等寬一列，年份用一條可橫向捲動的軌道（不換行、不填色） */
  .statnav{display:grid;grid-template-columns:repeat(3,1fr);
    border-top:1px solid var(--outline-variant);border-bottom:1px solid var(--outline-variant);
    margin-bottom:var(--sp-lg)}
  .statnav button{background:transparent;border:none;border-left:1px solid var(--outline-variant);
    padding:var(--sp-md) var(--sp-sm);text-align:left;cursor:pointer;color:var(--on-surface)}
  .statnav button:first-child{border-left:none;padding-left:0}
  .statnav b{display:block;font-family:var(--serif);font-size:15px;line-height:22px;font-weight:700}
  .statnav span{display:block;color:var(--on-surface-variant);font-size:var(--t-label);
    line-height:var(--lh-label);letter-spacing:var(--ls-label);margin-top:2px}
  .yearrail{display:flex;gap:var(--sp-xl);overflow-x:auto;scrollbar-width:none;
    border-bottom:1px solid var(--outline-variant);margin-bottom:var(--sp-xl)}
  .yearrail::-webkit-scrollbar{display:none}
  .yearrail button{flex:none;background:transparent;border:none;cursor:pointer;
    padding:0 0 var(--sp-sm);font-size:16px;line-height:24px;font-weight:600;letter-spacing:.2px;
    color:var(--on-surface-variant);border-bottom:2px solid transparent;margin-bottom:-1px}
  .yearrail button[aria-pressed=true]{color:var(--on-surface);border-bottom-color:var(--on-surface)}

  /* 數字是主角：大襯線字 + 極小的標籤，靠對比而不是色塊做層次 */
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);
    gap:0;margin-bottom:var(--sp-xxl);
    border-top:1px solid var(--outline-variant)}
  .kpi{background:transparent;border:none;border-bottom:1px solid var(--outline-variant);
    padding:var(--sp-lg) 0}
  .kpi:nth-child(even){padding-left:var(--sp-lg);border-left:1px solid var(--outline-variant)}
  .kpi .v{font-family:var(--serif);font-weight:700;font-size:30px;line-height:40px;
    letter-spacing:-.5px;color:var(--kpi-accent,var(--on-surface))}
  .kpi .l{color:var(--on-surface-variant);font-size:var(--t-label);line-height:var(--lh-label);
    letter-spacing:var(--ls-label);text-transform:uppercase;margin-top:2px}

  /* 區塊小標：小字 + 大字距 + 上方一條線，雜誌的分欄感 */
  /* 小數據所頁尾（與壽星日、RelateStats 共用）：黑點跟著 on-surface 走，深色主題才看得到 */
  .studio{margin-top:var(--sp-xxl);padding:32px var(--sp-xl) 28px;background:var(--surface-variant);
    border-top:1px solid var(--outline-variant)}
  .studio-head{display:flex;align-items:center;gap:18px}
  .studio .dots{display:grid;grid-template-columns:repeat(4,10px);gap:6px;flex:none}
  .studio .dots i{width:10px;height:10px;border-radius:50%;background:var(--outline-variant)}
  .studio .dots i.k{background:var(--on-surface)}
  .studio .dots i.g{background:#B07A2E}
  .studio-name{font-family:var(--serif);font-size:19px;line-height:26px;font-weight:700;letter-spacing:4px}
  .studio-sub{font-size:14px;line-height:20px;letter-spacing:6px;color:#B07A2E;margin-top:2px}
  .studio-tag{margin-top:var(--sp-xl);font-size:15px;line-height:24px}
  .studio-links{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:var(--sp-xl);
    padding-top:var(--sp-lg);border-top:1px solid var(--outline-variant);font-size:15px;line-height:22px}
  .studio-links a{color:var(--on-surface-variant);text-decoration:none}
  .studio-links a[aria-current]{color:#B07A2E}
  .studio-links .sep{color:var(--outline)}
  .studio-copy{margin-top:var(--sp-xl);font-size:13px;line-height:20px;color:var(--on-surface-variant)}
  .sect{font-size:var(--t-label);line-height:var(--lh-label);letter-spacing:var(--ls-label);
    text-transform:uppercase;color:var(--on-surface-variant);
    padding-top:var(--sp-md);border-top:2px solid var(--sect-accent,var(--on-surface));
    margin:var(--sp-xxl) 0 var(--sp-md)}
  .empty{color:var(--on-surface-variant);text-align:center;
    padding:72px var(--sp-lg);font-size:var(--t-body);line-height:var(--lh-body)}
  .bar{height:5px;background:var(--surface-container-high);border-radius:3px;
    overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;background:var(--primary)}

  #toast{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(140px + env(safe-area-inset-bottom));background:var(--primary-container);
    color:var(--on-primary-container);padding:10px var(--sp-lg);border-radius:var(--r-md);
    font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;
    max-width:88vw;text-align:center;border:1px solid var(--outline-variant)}
  #toast.on{opacity:1}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:60vh;gap:var(--sp-lg);text-align:center;padding:var(--sp-xxl)}

  /* 行事曆：月網格。今天與有演出的日子要用不同標示——
     只用同一種顏色的話，「今天」和「有場次」會分不出來。 */
  .cal-head{display:flex;align-items:center;gap:var(--sp-sm);margin-bottom:var(--sp-md)}
  .cal-title{font-family:var(--serif);font-weight:700;font-size:18px;flex:1;text-align:center}
  .cal-nav{background:none;border:1px solid var(--outline-variant);color:var(--on-surface);
    border-radius:var(--r-md);width:34px;height:34px;font-size:16px;cursor:pointer}
  .legend{display:flex;gap:var(--sp-lg);margin-top:var(--sp-md);font-size:11px;
    color:var(--on-surface-variant);letter-spacing:.6px}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:8px;height:8px;border-radius:50%;display:block}

  /* 我的：設定列 */
  .rowitem{display:flex;align-items:center;gap:var(--sp-lg);padding:var(--sp-lg) 0;
    border-bottom:1px solid var(--outline-variant)}
  .rowitem:last-child{border-bottom:none}
  .rowitem .t{flex:1;min-width:0}
  .rowitem .t b{display:block;font-size:14px;font-weight:600;line-height:20px}
  .avatar{width:48px;height:48px;border-radius:50%;background:transparent;
    border:1px solid var(--on-surface);color:var(--on-surface);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-weight:700;font-size:20px;flex:none}
  .rowitem .t b{font-family:var(--serif);font-size:17px;line-height:26px;font-weight:700}
  /* 分段用底線標示選取，不用填色膠囊——填色塊在安靜的版面上太吵 */
  .seg{display:flex;gap:var(--sp-xl);border-bottom:1px solid var(--outline-variant)}
  .seg.full{width:100%}
  .seg{align-items:flex-end}
  .seg button{background:transparent;border:none;color:var(--on-surface-variant);
    padding:0 0 var(--sp-sm);font-size:16px;line-height:24px;
    letter-spacing:.2px;font-weight:600;cursor:pointer;
    border-bottom:2px solid transparent;margin-bottom:-1px}
  /* 右側的計數：分段列原本右半邊整片空白，補上「有幾筆」才不會虛 */
  .seg-count{margin-left:auto;padding-bottom:var(--sp-sm);
    font-size:var(--t-meta);color:var(--on-surface-variant);letter-spacing:var(--ls-label)}
  .seg button[aria-pressed="true"]{color:var(--on-surface);border-bottom-color:var(--on-surface)}

  /* 月曆網格（行事曆與活動共用），對應 App 的 FreeEventGrid */
  .mg-dows{display:grid;grid-template-columns:repeat(7,1fr)}
  .mg-dows div{text-align:center;font-size:10px;line-height:14px;letter-spacing:.8px;
    font-weight:600;color:var(--on-surface-variant);padding:var(--sp-xs) 0}
  /* 每一列都是自己的定位脈絡：跨日色條要疊在這一列的格子上 */
  .mg-row{position:relative;height:48px}
  .mg-cells{display:grid;grid-template-columns:repeat(7,1fr);height:100%}
  .mg-cell{margin:1.5px;border-radius:6px;background:var(--surface);
    border:1px solid transparent;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:3px;cursor:pointer;overflow:hidden}
  .mg-cell.blank{background:transparent;cursor:default}
  .mg-cell.today{background:var(--surface-variant);border-color:var(--primary)}
  .mg-cell.sel{background:var(--primary-container);color:var(--on-primary-container)}
  .mg-n{font-size:10px;line-height:14px}
  .mg-cell.today .mg-n,.mg-cell.sel .mg-n{font-weight:700}
  .mg-dots{display:flex;align-items:center;gap:2px;height:6px}
  .mg-dots i{width:5px;height:5px;border-radius:50%;display:block}
  .mg-dots i.solid{background:var(--primary)}
  .mg-dots i.hollow{border:1px solid var(--primary)}
  .mg-dots i.song{background:var(--secondary)}
  .mg-dots u{font-size:8px;text-decoration:none;color:var(--on-surface-variant)}
  /* 色條層不吃點擊，否則會擋住下面格子的日期選取 */
  .mg-spans{position:absolute;left:1.5px;right:1.5px;bottom:3px;pointer-events:none}
  .mg-spans i{position:absolute;bottom:0;height:3px;border-radius:2px;display:block}
  .mg-spans i:nth-child(2){bottom:5px}
  .mg-spans i:nth-child(3){bottom:10px}
  .mg{margin-bottom:var(--sp-md)}

  /* 演唱會條目（重新設計）。
     原本是「整張漸層底 + scrim + 疊字」，兩個問題：
       (1) 兩個相近的莫蘭迪色做線性漸層，結果是一片糊掉的濁色；
       (2) 沒有封面圖時還「假裝自己是海報」，反而顯得廉價。
     改成編輯式：日期用大襯線數字當視覺錨點、每場一個單一強調色（不是漸層），
     有圖才放圖、而且圖不壓字（圖在上、字在下，像雜誌的圖說）。 */
  .ec{display:block;padding:var(--sp-xl) 0;border-bottom:1px solid var(--outline-variant);cursor:pointer}
  .ec:last-child{border-bottom:none}
  .ec-cover{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;
    margin-bottom:var(--sp-lg);background:var(--surface-variant)}
  .ec-row{display:flex;gap:var(--sp-lg);align-items:flex-start}
  /* 日期方塊：大襯線日 + 小字月份，是這張卡的視覺錨點 */
  .ec-day{flex:none;width:56px;text-align:center;
    border-top:2px solid var(--ec-accent);padding-top:6px}
  .ec-dd{font-family:var(--serif);font-size:32px;line-height:36px;font-weight:700;
    letter-spacing:-1px;color:var(--ec-accent)}
  .ec-mo{font-size:11px;line-height:15px;letter-spacing:var(--ls-label);
    text-transform:uppercase;color:var(--on-surface-variant);margin-top:2px}
  .ec-main{flex:1;min-width:0}
  .ec-name{font-family:var(--serif);font-size:var(--t-title);line-height:var(--lh-title);
    font-weight:700;letter-spacing:-.2px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ec-sub{color:var(--on-surface-variant);font-size:var(--t-meta);line-height:var(--lh-meta);
    margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ec-tags{margin-top:8px;display:flex;align-items:center;gap:var(--sp-md);flex-wrap:wrap}
  .ec-cd{font-size:12px;line-height:17px;letter-spacing:var(--ls-label);
    text-transform:uppercase;font-weight:700;color:var(--ec-accent)}
  .ec-warn{font-size:12px;line-height:17px;letter-spacing:var(--ls-label);
    text-transform:uppercase;font-weight:600;color:var(--on-surface-variant);
    border:1px solid var(--outline-variant);padding:1px 7px}
  /* 清單模式：與 App 的 ShowListRow 對應，縮圖 + 兩行文字 */
  .lr{display:flex;gap:var(--sp-lg);align-items:center;padding:var(--sp-lg) 0;
    border-bottom:1px solid var(--outline-variant);cursor:pointer}
  .lr-thumb{width:52px;height:52px;border-radius:0;flex:none;
    background-size:cover;background-position:center;position:relative;overflow:hidden}
  .lr-t{flex:1;min-width:0}
  .lr-t b{display:block;font-family:var(--serif);font-size:16px;line-height:24px;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lr-days{font-size:var(--t-label);line-height:var(--lh-label);letter-spacing:var(--ls-label);
    font-weight:600;text-transform:uppercase;color:var(--on-surface-variant);flex:none}
  /* 清單卡片左滑刪除：卡片本身用 transform 位移，露出底下疊在後面的刪除鈕，
     手指放開後依位移量決定「彈開」還是「彈回」——跟手機常見的清單刪除手勢一致。 */
  .lr-row{position:relative;overflow:hidden;touch-action:pan-y}
  .lr-row .lr{position:relative;background:var(--background);will-change:transform}
  .lr-row.lr-anim .lr{transition:transform .18s ease}
  .lr-del{position:absolute;top:0;right:0;bottom:0;width:84px;border:none;
    background:var(--error);color:#fff;font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;cursor:pointer}

  /* 音樂祭時間表：舞台為欄、時段為列。欄數會超出畫面寬，所以整個網格自己橫向捲動
     （包一層 overflow-x，不能讓 body 橫捲，否則整站版面都會跟著跑）。 */

  /* 年度回顧：整頁深色 story。刻意不吃網站的淺色代幣——這頁是要截圖分享的，
     深色滿版才有海報感（與 App 的 WrappedScreen 一致）。 */
  .wrap-stage{position:relative;overflow:hidden;border-radius:var(--r-lg);
    min-height:min(78vh,620px);display:flex;flex-direction:column;justify-content:center;
    padding:96px 24px 64px 28px}
  .wrap-ring{position:absolute;border-radius:50%;pointer-events:none}
  .wrap-wm{position:absolute;top:12px;left:16px;font-size:110px;line-height:1;font-weight:900;
    color:rgba(255,255,255,.06);pointer-events:none;white-space:nowrap}
  .wrap-body{position:relative;display:flex;flex-direction:column;align-items:flex-start}
  .wrap-dots{position:absolute;left:0;right:0;bottom:22px;display:flex;gap:6px;justify-content:center}
  .wrap-dots i{width:6px;height:6px;border-radius:50%;background:#fff;display:block}
  /* 左右各半的透明翻頁區。放在內容下層，才不會擋住之後可能加的連結。 */
  .wrap-nav{position:absolute;top:0;bottom:0;width:38%;border:none;background:transparent;
    cursor:pointer;padding:0}
  .wrap-close{position:absolute;top:14px;right:14px;border:none;background:rgba(255,255,255,.14);
    color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:15px;line-height:1}

  /* 轉場：只做很短的淡入 + 微位移。時間拉長會讓每次切換都像在等，
     而 iOS 上過度動畫比沒有動畫更容易被嫌卡。 */
  @keyframes pageIn { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }
  .page-in{animation:pageIn .18s ease-out}
  @keyframes slideL { from { opacity:0; transform:translateX(16px) } to { opacity:1; transform:none } }
  @keyframes slideR { from { opacity:0; transform:translateX(-16px) } to { opacity:1; transform:none } }
  .slide-l{animation:slideL .2s ease-out}
  .slide-r{animation:slideR .2s ease-out}
  nav button, .seg button, .ec, .card, .lr { transition:opacity .15s, color .15s, border-color .15s }
  .ec:active, .card:active, .lr:active { opacity:.55 }
  /* 使用者要求減少動態時一律關掉——這是無障礙設定，不是可選的美化。 */
  @media (prefers-reduced-motion: reduce){
    .page-in,.slide-l,.slide-r{animation:none}
    *{transition:none !important}
  }

  /* 圖表：線稿風，不填色塊。雜誌的資訊圖多半只有線與少量網點。 */
  .chart{margin:var(--sp-lg) 0;position:relative;touch-action:pan-y}
  .chart-head{display:flex;align-items:baseline;gap:var(--sp-sm);margin-bottom:6px}
  .chart-val{font-family:var(--serif);font-size:22px;line-height:30px;font-weight:700}
  .chart-at{font-size:var(--t-meta);color:var(--on-surface-variant)}
  .chart-axis{display:flex;justify-content:space-between;margin-top:4px;
    font-size:12px;color:var(--on-surface-variant);letter-spacing:.4px}
  .chart-cursor{position:absolute;top:0;bottom:0;width:1px;background:var(--on-surface);
    opacity:.35;pointer-events:none;display:none}
  /* 可點的統計列：滑過時整列變色，暗示點得下去 */
  .hb{cursor:pointer}
  .hb:hover .hb-t{text-decoration:underline}
  .drill-back{background:none;border:none;color:var(--on-surface);cursor:pointer;
    font-size:var(--t-meta);letter-spacing:var(--ls-label);text-transform:uppercase;
    font-weight:600;padding:0 0 var(--sp-lg)}
  .chart svg{width:100%;display:block;overflow:visible}
  /* 直條圖。標籤與數字都固定兩行，欄與欄的基線才對得齊——
     之前沒場次的日子輸出空字串，那幾格變一行就跟其他欄錯開了。 */
  .wk{display:grid;gap:6px;align-items:end;height:110px}
  .wk-col{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
  .wk-bar{background:var(--hb-accent,var(--on-surface));width:100%;min-height:2px}
  .wk-labels{display:grid;gap:6px;align-items:start;margin-top:8px}
  .wk-lb{text-align:center;font-size:13px;line-height:18px;color:var(--on-surface-variant)}
  .wk-lb b{display:block;font-size:14px;font-weight:700;color:var(--on-surface);
    font-family:var(--serif)}
  /* 橫條排行：名稱在左、長度即比例、數值靠右 */
  .hb{display:flex;align-items:center;gap:var(--sp-md);padding:9px 0}
  .hb-t{width:96px;flex:none;font-size:var(--t-meta);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hb-track{flex:1;height:6px;background:var(--surface-variant)}
  .hb-fill{height:100%;background:var(--hb-accent,var(--on-surface))}
  .hb-v{width:64px;flex:none;text-align:right;font-size:var(--t-meta);
    color:var(--on-surface-variant)}
  .rank{display:flex;align-items:baseline;gap:var(--sp-md);padding:10px 0;
    border-bottom:1px solid var(--outline-variant)}
  .rank:last-child{border-bottom:none}
  .rank-n{font-family:var(--serif);font-size:15px;font-weight:700;
    width:22px;color:var(--on-surface-variant)}
  .rank-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rank-v{font-size:var(--t-meta);color:var(--on-surface-variant);
    letter-spacing:var(--ls-label)}
</style>
<!-- 網站分析（GA4）。編號只寫在 analytics.js 裡，換帳號改一個地方就好。 -->
<script src="analytics.js"></script>
<!-- Buy Me a Coffee 浮動小工具。
     **必須是 inline 的 script 標籤**：這支 widget 是在 DOMContentLoaded 時才渲染的，
     用 JS 動態塞進 head 的話，載入完成時那個事件早就過了，按鈕永遠不會出現
     （而且不會有任何錯誤訊息，純粹就是沒反應）。所以這裡接受帳號代號重複三次。
     同樣的標籤也在 about.html 與 help.html，要改記得三個一起改。
     刻意不放 privacy.html 與 delete-account.html：使用者在看那兩頁的時候，
     不是在「要不要支持作者」的心情裡。

     y_margin 在這頁是 82 而不是其他兩頁的 18：首頁有固定在底部的導覽列（64px），
     用預設值的話這顆按鈕會整個壓在「我的」上面（實測重疊 46px）。
     64 + 18 的呼吸空間 = 82。about / help 沒有那條導覽列，維持 18。 -->
<script data-name="BMC-Widget" data-cfasync="false"
        src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js"
        data-id="celinefu" data-description="支持小數據所繼續做下去"
        data-message="" data-color="#FF813F"
        data-position="Right" data-x_margin="18" data-y_margin="82"></script>
</head>
<body>

<header>
  <div class="appbar">
    <h1 id="pageTitle">演唱會</h1>
    <span class="grow"></span>
    <button class="link" id="dispBtn" hidden>清單</button>
    <button class="link" id="authBtn">登入</button>
  </div>
</header>

<main>
  <div id="signedOut" class="center">
    <div class="meta">登入後就能記錄你看過的每一場演出。</div>
    <button class="btn" id="signInBtn">用 Google 登入</button>
    <div class="meta" style="max-width:30ch">已經有手機 App 的話，用同一個帳號登入即可。</div>
  </div>
  <div id="view"></div>
</main>

<button class="fab" id="fab" hidden>
  <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
  新增
</button>

<!-- 底部導覽：項目與順序完全對齊 App 的 bottomNavItems
     （演唱會 → 行事曆 → 活動 → 統計 → 我的）。 -->
<nav id="tabs">
  <button data-tab="shows" data-title="演唱會" aria-selected="true">
    <span class="ind"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 10V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v4a2 2 0 0 1 0 4v4a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-4a2 2 0 0 1 0-4zm-2-1.46a4 4 0 0 0 0 6.92V18H4v-2.54a4 4 0 0 0 0-6.92V6h16z"/></svg></span>
    演唱會
  </button>
  <button data-tab="calendar" data-title="行事曆" aria-selected="false">
    <span class="ind"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2m0 16H5V10h14zM5 8V6h14v2z"/></svg></span>
    行事曆
  </button>
  <button data-tab="events" data-title="活動" aria-selected="false">
    <span class="ind"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6h-2.18a3 3 0 0 0 .18-1 3 3 0 0 0-5.4-1.8L12 4l-.6-.8A3 3 0 0 0 6 5a3 3 0 0 0 .18 1H4a2 2 0 0 0-2 2v2h2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10h2V8a2 2 0 0 0-2-2m-5-2a1 1 0 1 1 0 2 1 1 0 0 1 0-2M9 4a1 1 0 1 1 0 2 1 1 0 0 1 0-2M6 20V10h5v10zm12 0h-5V10h5z"/></svg></span>
    活動
  </button>
  <button data-tab="stats" data-title="統計" aria-selected="false">
    <span class="ind"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg></span>
    統計
  </button>
  <button data-tab="profile" data-title="我的" aria-selected="false">
    <span class="ind"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5m0 2c-3.34 0-10 1.67-10 5v3h20v-3c0-3.33-6.66-5-10-5"/></svg></span>
    我的
  </button>
</nav>

<div id="toast"></div>
<dialog id="editor">
  <form method="dialog">
    <div class="dlg-body">
      <h3 id="edTitle" style="margin:0 0 6px">新增演唱會</h3>
      <label>演出名稱 *</label><input id="f_name" required>
      <label>歌手 / 樂團</label><input id="f_artist" list="artistList" placeholder="多位用 ｜ 或 、 分隔">
      <div class="two">
        <div><label>日期 *</label><input id="f_date" type="date" required></div>
        <div><label>開演時間</label><input id="f_time" type="time"></div>
      </div>
      <label>場地</label><input id="f_venue">
      <div class="two">
        <div><label>縣市</label><input id="f_city"></div>
        <div><label>票價 NT$</label><input id="f_price" type="number" inputmode="numeric"></div>
      </div>
      <label>售票平台</label><input id="f_platform">
      <label>開賣時間・可加好幾組</label>
      <div id="f_saleRows"></div>
      <button type="button" class="link" id="f_addSale" style="padding:2px 0">＋ 新增開賣時間</button>
      <label>購票狀況</label>
      <select id="f_status">
        <option value="NONE">無</option>
        <option value="BOUGHT">已購票</option>
        <option value="PICKED_UP">已取票</option>
        <option value="WATCHED">已看過</option>
      </select>
      <label>備忘錄</label><textarea id="f_notes"></textarea>
      <div id="edDelWrap" hidden><button type="button" class="danger" id="edDelete">刪除這場</button></div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn ghost" id="edCancel">取消</button>
      <button type="button" class="btn" id="edSave">儲存</button>
    </div>
  </form>
</dialog>

<datalist id="artistList"></datalist>

<dialog id="songEditor">
  <form method="dialog">
    <div class="dlg-body">
      <h3 id="sgTitle" style="margin:0 0 6px">記一首歌</h3>
      <label>歌名 *</label><input id="sg_song" required>
      <label>歌手 / 樂團</label><input id="sg_artist" list="artistList">
      <div class="two">
        <div><label>日期 *</label><input id="sg_date" type="date" required></div>
        <div><label>專輯</label><input id="sg_album"></div>
      </div>
      <label>感受</label>
      <div class="seg full" id="sg_reactions" style="margin-bottom:var(--sp-sm)">
        <button type="button" data-rx="FIRE" aria-pressed="false">精彩</button>
        <button type="button" data-rx="TREASURE" aria-pressed="false">收藏</button>
        <button type="button" data-rx="TEARS" aria-pressed="false">感動</button>
        <button type="button" data-rx="PERFECT" aria-pressed="false">難忘</button>
      </div>
      <label>在哪一場聽到的</label>
      <select id="sg_concert"></select>
      <label>備忘</label><textarea id="sg_memo"></textarea>
      <div id="sgDelWrap" hidden><button type="button" class="danger" id="sgDelete">刪除這首</button></div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn ghost" id="sgCancel">取消</button>
      <button type="button" class="btn" id="sgSave">儲存</button>
    </div>
  </form>
</dialog>

<dialog id="evEditor">
  <form method="dialog">
    <div class="dlg-body">
      <h3 id="evTitle">新增活動</h3>
      <div class="meta" id="evHint" style="margin-bottom:var(--sp-sm)"></div>
      <label>活動名稱 *</label><input id="g_name" required>
      <label>藝人 / 樂團</label>
      <div id="g_artistRows"></div>
      <button type="button" class="link" id="g_addArtist" style="padding:2px 0">＋ 新增藝人</button>
      <div class="two">
        <div><label>日期 *</label><input id="g_date" type="date" required></div>
        <div><label>開始時間</label><input id="g_time" type="time"></div>
      </div>
      <div class="two">
        <div><label>結束日期・跨日才填</label><input id="g_endDate" type="date"></div>
        <div><label>結束時間</label><input id="g_endTime" type="time"></div>
      </div>
      <label>地點</label><input id="g_venue">
      <label>縣市</label><input id="g_city" placeholder="可直接輸入">
      <label>票價</label>
      <div class="seg full" id="g_paidSeg" style="margin-bottom:var(--sp-sm)">
        <button type="button" data-paid="0" aria-pressed="true">免費</button>
        <button type="button" data-paid="1" aria-pressed="false">付費</button>
      </div>
      <input id="g_price" placeholder="例：500，或 早鳥 400／現場 500" hidden>
      <label>售票 / 報名連結</label><input id="g_ticketUrl">
      <label>開賣時間・可加好幾組</label>
      <div id="g_saleRows"></div>
      <button type="button" class="link" id="g_addSale" style="padding:2px 0">＋ 新增開賣時間</button>
      <label>來源網址</label><input id="g_sourceUrl">
      <label>備註</label><textarea id="g_note" placeholder="入場方式、注意事項…"></textarea>
      <label id="g_imgLabel">活動圖（最多 5 張）</label>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <input id="g_image" type="file" accept="image/*" multiple style="flex:1;min-width:160px">

<script type="module">

  getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc, enableIndexedDbPersistence,

} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js';

const cfg = window.BANDARY_FIREBASE_CONFIG;

  document.querySelector('main').innerHTML =
    '<div class="empty">尚未設定 Firebase。<br>請把 <code>firebase-config.example.js</code> 複製成 ' +
    '<code>firebase-config.js</code> 並填入 Console 給的設定值。</div>';
  throw new Error('missing firebase config');
}

const app = initializeApp(cfg);
const auth = getAuth(app);
const db = getFirestore(app);
// Cloud Functions 在 asia-east1（見 functions/index.js 的 region）。手動觸發抓取用。
const functions = getFunctions(app, 'asia-east1');
// 離線持久化交給 Firestore SDK；多分頁同時開啟時只有一個能拿到鎖，失敗不影響線上使用。
enableIndexedDbPersistence(db).catch(() => {});

const $ = (s) => document.querySelector(s);
const view = $('#view');
let user = null;
let concerts = [];      // 只保留未刪除的
let trashed = [];       // 垃圾桶（deletedAt 有值的），保留 7 天可還原
let followedArtists = []; // 追蹤中的藝人，與 App 共用 users/{uid}.followedArtists
let myNickname = null;    // App 內自訂的暱稱（users/{uid}.nickname），好友頁與排行榜顯示用
let shareNewShowsToEvents = true;  // users/{uid}.shareNewShowsToEvents：新增演出時分享到活動頁（預設開，與 App 共用）
let viewingArtist = null; // 開著某位藝人的詳情頁時是他的名字
let wrappedYear = null;   // 年度回顧看的年份
let wrappedPage = 0;      // 年度回顧目前第幾頁
// 音樂祭時間表：draft 是編輯中的副本，按儲存才寫回雲端（避免每點一格就打一次 Firestore）
let events = [];
let tab = 'shows';
let editingId = null;
let calMonth = null;    // 行事曆目前顯示的月份（YYYY-MM）
let calSelected = null; // 行事曆選取的日期
let allEvents = [];     // 全部已核准活動（月曆要看得到過去的月份，不能只留未來的）
// 活動頁檢視：list / cal（預設月曆）。舊版預設是清單，存在 localStorage 的值會一直黏著，
// 所以做一次性重設——之後使用者自己切換的選擇照常記住。
if (!localStorage.getItem('bandary-event-view-default-cal')) {
  localStorage.removeItem('bandary-event-view');
  localStorage.setItem('bandary-event-view-default-cal', '1');
}
let eventView = localStorage.getItem('bandary-event-view') || 'cal';
// 演唱會顯示模式：poster（海報拼貼，與 App 預設一致）/ list
let showDisplay = localStorage.getItem('bandary-show-display') || 'poster';
// 演唱會分頁：upcoming（即將到來，含今天）/ history（歷史紀錄，只有過去的）
let showSplit = 'upcoming';
// 清單模式目前左滑開著的那一列（同一時間只留一列開著）；#view 本身不會被整個換掉，
// 只有 innerHTML 會變，所以收合用的 document click listener 要掛在模組層級一次就好，
// 不能每次 renderShows() 都重掛一份，不然每次重繪都會多疊一份 listener。
let openSwipeRow = null;
// 好友 / 排行榜（社群頁）狀態
let friends = [];
let friendRequests = [];
let myHandle = null;
let discoverableByEmail = false;
let socialLoaded = false;
let socialPage = null;      // null＝一般分頁；'friends'／'board'＝社群子頁（入口位置與 App 一致）
let leaderboard = [];
let leaderboardOptOut = localStorage.getItem('bandary-leaderboard-optout') === '1';
let viewingFriend = null;   // { friend, calendar } — 開著某位好友的共享日曆時才有值
// 每日選歌（音樂日記）。與 App 共用 users/{uid}/daily_songs。
let songs = [];
let songsLoaded = false;
let editingSongId = null;
let songMonth = null;       // 選歌頁目前顯示的月份（YYYY-MM）
// 行事曆頁的兩個模式：shows＝演出月曆、songs＝選歌，與 App 的 CalendarHubScreen 一致。
let calMode = localStorage.getItem('bandary-cal-mode') || 'shows';
function closeSwipeRow() {
  if (!openSwipeRow) return;
  openSwipeRow.classList.add('lr-anim');
  openSwipeRow.querySelector('.lr').style.transform = '';
  openSwipeRow.classList.remove('open');
  openSwipeRow = null;
}
document.addEventListener('click', (e) => {
  if (openSwipeRow && !openSwipeRow.contains(e.target)) closeSwipeRow();
});
let evMonth = null;
let evSelected = null;
let statDrill = null;   // 統計鑽取：{ kind, value, label } → 顯示符合的場次
let statYear = null;    // 統計年份篩選：null＝全部，或 "YYYY"
// 活動篩選（清單檢視）：關鍵字 + 日期區間，打字時只重繪清單不重繪整頁，避免輸入框失焦。
let evQuery = '';
let evFrom = '';
let evTo = '';
let isCloudAdmin = false;   // Firestore 的 admins/{uid} 是否存在（與 App 內的本機管理員旗標無關）
let pendingEvents = [];     // 待審核投稿／修改提案（只有管理員讀得到、也只有管理員用得到）
let csEditingId = null;     // 目前正在編輯哪個 crawl_sources 文件；null＝新增模式
let myEvents = [];          // 自己投稿或提出修改的（任何狀態），給「我的投稿」看審核結果
let eventsLoaded = false;   // 活動是否已抓過一次（用 events.length 判斷會在「真的 0 筆」時每次重抓）
let editingEvent = null;
let editingOwnSubmission = false;  // true＝在「我的投稿」編輯自己還在審核中的那份 → 就地更新、維持 pending
let evImages = [];                 // 活動圖（最多 5 張，Base64/網址）；網頁選圖後即時編碼直接進這裡
// 活動頁使用說明：第一次進來自動展開，按「知道了」後收起（記 localStorage，不再自動跳）。
let evGuideOpen = null;

// ── 主題 ────────────────────────────────────────────────
// 預設淺色，與 App 的預設一致。選擇存 localStorage：主題偏好在 App 是存本機
// DataStore、不上雲，網頁這邊同理，不要寫進 Firestore 汙染同步資料。
const THEME_KEY = 'bandary-theme';
function applyTheme(mode) {
  const dark = mode === 'dark' ||
    (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  // 位址列顏色跟著換，否則深色頁面配白色狀態列會很突兀。
  document.querySelector('meta[name="theme-color"]')
    .setAttribute('content', dark ? '#000000' : '#F5F6F4');
}
function currentTheme() { return localStorage.getItem(THEME_KEY) || 'light'; }
function setTheme(mode) { localStorage.setItem(THEME_KEY, mode); applyTheme(mode); render(); }
applyTheme(currentTheme());
// 跟隨系統時，使用者中途切換系統深淺色也要即時反應。
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (currentTheme() === 'system') applyTheme('system');
});

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('on'), 2600);
}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Android 端存的是 kotlinx LocalDateTime.toString()，例如 2026-07-21T19:30。
// 這裡一律用字串處理，不轉成 Date——轉了會被瀏覽器時區偏移，日期可能整個差一天。
const dateOf = (iso) => String(iso || '').slice(0, 10);

/**
 * 本地時區的今天（YYYY-MM-DD）。
 * 不能用 new Date().toISOString().slice(0,10)——那是 UTC 日期，台灣是 UTC+8，
 * 早上 08:00 之前會拿到「昨天」，行事曆的今天標記與活動篩選都會整整差一天。
 */
function todayLocal() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

/** 純字串的日期加一天，不經過 Date 的時區轉換。 */
function nextDay(iso) {
  const d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + 1);
  return d.toISOString().slice(0, 10);
}
const timeOf = (iso) => String(iso || '').slice(11, 16);
function fmtDate(iso) {
  const d = dateOf(iso);
  if (!d) return '';
  const [y, m, dd] = d.split('-');
  return `${y}/${Number(m)}/${Number(dd)}`;
}

// ── 資料存取 ─────────────────────────────────────────────
async function loadConcerts() {
  if (!user) { concerts = []; trashed = []; return; }
  const snap = await getDocs(collection(db, 'users', user.uid, 'concerts'));
  const all = snap.docs.map((d) => d.data());
  concerts = all.filter((c) => !c.deletedAt)     // 垃圾桶裡的不顯示
    .sort((a, b) => String(b.dateTime).localeCompare(String(a.dateTime)));
  // 垃圾桶：保留 7 天，最近刪的排前面。與 App 的 TrashScreen 同一份資料。
  trashed = all.filter((c) => c.deletedAt)
    .sort((a, b) => (b.deletedAt || 0) - (a.deletedAt || 0));
}

/** 還原＝把 deletedAt 清掉並更新 updatedAt，與 App 的 restoreConcert 一致。 */
async function restoreConcert(c) {
  const now = Date.now();
  await setDoc(doc(db, 'users', user.uid, 'concerts', c.id), { ...c, deletedAt: null, updatedAt: now });
}

/** 永久刪除：真的刪文件。手機端是鏡像同步，這裡刪掉之後手機同步時也會跟著消失。 */
async function purgeConcert(id) {
  await deleteDoc(doc(db, 'users', user.uid, 'concerts', id));
}

// ── 追蹤中的藝人 ─────────────────────────────────────────
// 存在 users/{uid}.followedArtists，與 App 共用同一份（App 端原本只存在手機本機，
// v1.48.0 起改成以雲端為準）。比對一律用正規化過的 key，避免大小寫／空白造成漏判。
// 與 App 的 artistFollowKey 逐步對應：trim → 全形空白換半形 → 連續空白收成一個 → 轉小寫。
// 這裡不能「把空白全部拿掉」——那樣「Mr Child」與「MrChild」會被當成同一位，跟 App 判斷不一致。
function artistFollowKey(name) {
  return String(name || '').trim().replace(/　/g, ' ').replace(/\s+/g, ' ').toLowerCase();
}

async function loadFollowed() {
  if (!user) { followedArtists = []; myNickname = null; return; }
  const d = await getDoc(doc(db, 'users', user.uid));
  const data = d.exists() ? d.data() : {};
  followedArtists = Array.isArray(data.followedArtists)
    ? data.followedArtists.filter((s) => String(s).trim()) : [];
  // 自訂暱稱由 App 寫上雲端；沒設定就退回 Google 帳號名稱。
  myNickname = String(data.nickname || '').trim() || null;
  shareNewShowsToEvents = data.shareNewShowsToEvents !== false;
}

/** 好友頁與排行榜要顯示的名字：自訂暱稱優先，與 App 的 currentDisplayName 同一套順序。 */
function myDisplayName() {
  return myNickname || user?.displayName || String(user?.email || '').split('@')[0] || '我';
}

function isFollowing(name) {
  const key = artistFollowKey(name);
  return followedArtists.some((a) => artistFollowKey(a) === key);
}

async function toggleFollow(name) {
  const clean = String(name).trim();
  if (!clean) return;
  const key = artistFollowKey(clean);
  const hit = followedArtists.find((a) => artistFollowKey(a) === key);
  followedArtists = hit ? followedArtists.filter((a) => a !== hit) : [...followedArtists, clean];
  await setDoc(doc(db, 'users', user.uid), { followedArtists }, { merge: true });
}

/** 距離自動永久刪除還剩幾天（保留 7 天），與 App 的 daysLeft 同一套。 */
function trashDaysLeft(deletedAt) {
  if (!deletedAt) return 7;
  const left = 7 - Math.floor((Date.now() - deletedAt) / 86400000);
  return Math.max(0, left);
}

/**
 * 是不是雲端管理員。看的是 Firestore 的 admins/{uid}，與 App 內用折扣碼開的
 * 本機管理員旗標無關——規則也是看這份文件。讀不到就當成一般使用者。
 */
async function checkAdmin() {
  if (!user) { isCloudAdmin = false; return; }
  try { isCloudAdmin = (await getDoc(doc(db, 'admins', user.uid))).exists(); }
  catch { isCloudAdmin = false; }
}

/**
 * 用邀請碼把自己變成雲端管理員：寫一份 admins/{自己的 uid}，內含輸入的碼。
 *
 * **真正把關的是 Firestore 規則，不是這段前端程式**——規則會用 get() 去查
 * admin_codes/{code} 存不存在且 active，不成立就拒絕寫入。前端只負責送出與回報結果，
 * 所以「亂打一組碼」不會成功，也沒辦法從前端繞過（碼本身前端讀不到）。
 * 規則範本見 CONSOLE_SETUP.md。
 */
async function claimAdmin() {
  if (!user) return;
  const input = prompt('輸入管理員邀請碼：', '');
  if (input === null) return;
  const code = input.trim();
  if (!code) return;
  try {
    await setDoc(doc(db, 'admins', user.uid), {
      code, email: user.email || null, createdAt: Date.now()
    });
    await checkAdmin();
    if (isCloudAdmin) {
      if (!eventsLoaded) { try { await loadEvents(); } catch { /* 待審核數之後再補 */ } }
      toast('已成為管理員');
    } else {
      toast('邀請碼無效');
    }
    render();
  } catch {
    // 規則拒絕就是碼不對／已停用。不要把原始錯誤丟出來，那只會洩漏規則細節。
    toast('邀請碼無效或已停用');
  }
}

/**
 * 寫入活動。權限模型與 App 完全一致：
 *   • 管理員新增 → 直接 approved；管理員編輯 → 就地更新
 *   • 一般使用者新增 → status=pending 投稿
 *   • 一般使用者編輯 → **不能改原文件**（規則只給 create），改成新增一份
 *     editOfId 指向原活動的修改提案，等管理員核准才套用
 * 欄位名稱與格式必須對齊 Android 的 FreeEvent.toCloudMap()。
 */
async function saveEvent(patch, existing, ownSubmission) {
  const now = Date.now();
  // ownSubmission：編輯自己「還在審核中」的投稿 → 就地更新同一份、維持原狀態（規則也只允許改成 pending）。
  const proposal = existing && !isCloudAdmin && !ownSubmission;
  const id = (proposal || !existing) ? crypto.randomUUID() : existing.id;
  const base = existing || {
    guestsByArtist: {}, endDate: null, endTime: null, ticketPrice: null, priceText: null,
    ticketUrl: null, saleTimes: [], note: null, sourceUrl: null,
    imageUri: null, imageUris: [], reviewComment: null
  };
  const merged = {
    ...base,
    ...patch,
    id,
    status: ownSubmission ? (existing.status || 'pending')
      : (isCloudAdmin && !proposal ? 'approved' : 'pending'),
    editOfId: ownSubmission ? (existing.editOfId || null) : (proposal ? existing.id : null),
    // createdBy 不能變（規則會擋）：編輯自己投稿時沿用原值。
    createdBy: ownSubmission ? (existing.createdBy || user.email || null)
      : (proposal || !existing ? (user.email || null) : (existing.createdBy || user.email || null)),
    createdAt: ownSubmission ? (existing.createdAt || now)
      : (proposal || !existing ? now : (existing.createdAt || now)),
    reviewComment: null   // 改過就清掉舊的退回意見
  };
  await setDoc(doc(db, 'free_events', id), merged);
  return { proposal, approved: merged.status === 'approved', ownSubmission };
}

/** 圖片壓縮成 Base64（不含 data: 前綴）——與 Android 的存法一致：長邊 800、JPEG 60。 */
function encodeImage(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 800 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      // Firestore 單文件上限 1MiB，這裡壓到 ~100KB 內，與 Android 同一個做法。
      res(c.toDataURL('image/jpeg', 0.6).split(',')[1]);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}


async function loadEvents() {
  // 2026-08-19 資安修正後，free_events 的讀取規則變成「已核准的公開；待審核／被駁回限
  // 投稿者本人與管理員」。Firestore 的 list 查詢在驗證規則時不看文件實際內容，只看查詢本身
  // 的 where 條件能不能「證明」每筆結果都一定符合規則——沒有 where('status','==','approved')
  // 的整包查詢，非管理員會被直接拒絕（不是回傳空陣列，是整個查詢失敗），這裡拆成三種查法：
  //   1. 管理員：isAdmin() 規則不看文件內容，對管理員來說整包查詢本來就可證明合規，直接撈全部。
  //   2. 一般使用者／未登入：只查已核准的（公開），登入的話另外查自己的投稿（含待審核/被駁回）。
  // 已知取捨：舊資料（改規則前建立、根本沒有 status 欄位）在 where('status','==','approved')
  // 底下會查不到（Firestore 對缺欄位的文件，等式查詢一律跳過）——管理員的整包查詢仍看得到；
  // 之後要幫舊資料補上 status:"approved" 欄位，一般使用者才會看到，這是待辦不是這次要處理的。
  let all;
  if (isCloudAdmin) {
    const snap = await getDocs(collection(db, 'free_events'));
    all = snap.docs.map((d) => d.data());
  } else {
    const approvedSnap = await getDocs(query(collection(db, 'free_events'), where('status', '==', 'approved')));
    const approved = approvedSnap.docs.map((d) => d.data());
    let mine = [];
    if (user) {
      const mineSnap = await getDocs(query(collection(db, 'free_events'), where('createdBy', '==', user.email)));
      mine = mineSnap.docs.map((d) => d.data());
    }
    const seen = new Set();
    all = [...approved, ...mine].filter((e) => {
      if (seen.has(e.id)) return false;
      seen.add(e.id);
      return true;
    });
  }
  const today = todayLocal();
  allEvents = all
    .filter((e) => (e.status || 'approved') === 'approved')
    .filter((e) => !e.editOfId)                  // 修改提案不是活動本身，不該出現在清單
    .sort((a, b) => String(a.dateTime).localeCompare(String(b.dateTime)));
  // 清單只給未來的；月曆要能翻到過去的月份，所以另外留 allEvents。
  events = allEvents.filter((e) => dateOf(e.dateTime) >= today);
  // 待審核（投稿＋修改提案），新的排前面。同一份 snapshot 撈出來，不用多打一次 Firestore。
  // 待審核依「演出日期」由近到遠排（不是送審時間）：爬蟲一次進來幾百筆時，
  // 越快開賣/開演的越該先看，跟哪筆先進系統無關。
  pendingEvents = all.filter((e) => e.status === 'pending')
    .sort((a, b) => String(a.dateTime || '').localeCompare(String(b.dateTime || '')));
  // 我的投稿：用 email 認人（createdBy 存的就是 email），新的排前面。
  myEvents = user
    ? all.filter((e) => e.createdBy && e.createdBy === user.email)
        .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
    : [];
  eventsLoaded = true;
}

// ── 管理員：活動審核 ─────────────────────────────────────
// 語意與 App 的 FreeEventsRepository.approve/reject 完全一致，兩邊審同一批資料不能有分歧。
const EV_DIFF_FIELDS = [
  ['name', '名稱'], ['artistName', '藝人'], ['dateTime', '日期時間'], ['endDate', '結束日'],
  ['endTime', '結束時間'], ['venue', '場地'], ['city', '縣市'], ['priceText', '票價'],
  ['ticketUrl', '售票連結'], ['sourceUrl', '活動連結'], ['note', '備註']
];

/** 修改提案 vs 原活動：列出實際改動的欄位。只給一份新資料，管理員無從判斷該不該核准。 */
function evDiff(proposal, original) {
  const out = [];
  EV_DIFF_FIELDS.forEach(([k, label]) => {
    const a = String(original[k] ?? '').trim();
    const b = String(proposal[k] ?? '').trim();
    if (a !== b) out.push({ label, from: a || '（空）', to: b || '（空）' });
  });
  // 嘉賓是 Map，攤平成穩定字串再比，否則鍵的順序不同會誤判成有改。
  const gs = (o) => Object.entries(o.guestsByArtist || {})
    .map(([m, g]) => m + '：' + (g || []).join('、')).sort().join(' / ');
  if (gs(original) !== gs(proposal)) {
    out.push({ label: '嘉賓', from: gs(original) || '（空）', to: gs(proposal) || '（空）' });
  }
  // 開賣時間同理：陣列先排序攤平再比，否則順序不同會誤判成有改。
  const ss = (o) => (o.saleTimes || []).filter((s) => s.at)
    .map((s) => saleLabel(s)).sort().join('・');
  if (ss(original) !== ss(proposal)) {
    out.push({ label: '開賣時間', from: ss(original) || '（空）', to: ss(proposal) || '（空）' });
  }
  return out;
}

// ── 活動重複偵測／合併／新增演出自動送審 ─────────────────────
// 與 App 的 domain/model/EventSubmission.kt 同一套規則，兩邊要一起改——否則同一筆投稿
// 在手機上被標「可能重複」、在網頁上卻不會。

/** 名稱正規化：只留字母與十進位數字（含中日韓文字），忽略大小寫、空白與標點。 */
function normalizeEventName(raw) {
  return Array.from(String(raw || '').toLowerCase()).filter((ch) => /[\p{L}\p{Nd}]/u.test(ch)).join('');
}

function eventNameBigrams(cps) {
  if (cps.length < 2) return cps.map((c) => c + '\u0000');
  const out = [];
  for (let i = 0; i < cps.length - 1; i++) out.push(cps[i] + '\u0001' + cps[i + 1]);
  return out;
}

/** 名稱是否像同一場：正規化相同／較短者 ≥ 4 字且互相包含／兩字組 Dice ≥ 0.6。 */
function isSimilarEventName(a, b) {
  const na = normalizeEventName(a), nb = normalizeEventName(b);
  if (!na || !nb) return false;
  if (na === nb) return true;
  const ca = Array.from(na), cb = Array.from(nb);
  if (Math.min(ca.length, cb.length) >= 4 && (na.includes(nb) || nb.includes(na))) return true;
  const ga = eventNameBigrams(ca), gb = eventNameBigrams(cb);
  const pool = gb.slice();
  let hit = 0;
  for (const g of ga) { const i = pool.indexOf(g); if (i >= 0) { hit++; pool.splice(i, 1); } }
  return (2 * hit) / (ga.length + gb.length) >= 0.6;
}

/** 兩個活動的日期區間有沒有重疊（多日活動看 endDate）。 */
function eventsShareDay(a, b) {
  const as = dateOf(a.dateTime), bs = dateOf(b.dateTime);
  const ae = a.endDate && a.endDate > as ? a.endDate : as;
  const be = b.endDate && b.endDate > bs ? b.endDate : bs;
  return as <= be && bs <= ae;
}

function findSimilarEvent(candidate, pool) {
  return (pool || []).find((x) => x.id !== candidate.id && eventsShareDay(x, candidate)
    && isSimilarEventName(x.name, candidate.name)) || null;
}

/** 合併：以 primary 為主，空欄位依序從 others 補；藝人、嘉賓、開賣時間、圖片取聯集（圖最多 5 張）。 */
function mergeEventRecords(primary, others) {
  const all = [primary, ...others];
  const text = (k) => { for (const e of all) { const v = String(e[k] ?? '').trim(); if (v) return v; } return null; };
  const seenA = new Set();
  const artists = all.flatMap((e) => String(e.artistName || '').split(' / ')).map((s) => s.trim())
    .filter((s) => { if (!s || seenA.has(s.toLowerCase())) return false; seenA.add(s.toLowerCase()); return true; });
  const guests = {};
  for (const e of all) for (const [h, list] of Object.entries(e.guestsByArtist || {})) {
    guests[h] = [...new Set([...(guests[h] || []), ...(list || [])])];
  }
  const prices = all.map((e) => e.ticketPrice).filter((p) => typeof p === 'number');
  const price = prices.find((p) => p > 0) ?? prices.find((p) => p < 0) ?? null;
  const imgsOf = (e) => (e.imageUris && e.imageUris.length) ? e.imageUris : (e.imageUri ? [e.imageUri] : []);
  const images = [...new Set(all.flatMap(imgsOf))].slice(0, 5);
  const seenS = new Set();
  const saleTimes = all.flatMap((e) => e.saleTimes || [])
    .filter((s) => s && s.at && !seenS.has(s.at) && seenS.add(s.at))
    .sort((x, y) => String(x.at).localeCompare(String(y.at)));
  return {
    ...primary,
    artistName: artists.join(' / '),
    guestsByArtist: guests,
    venue: text('venue') || '',
    city: text('city'),
    endDate: all.map((e) => e.endDate).find(Boolean) || null,
    endTime: all.map((e) => e.endTime).find(Boolean) || null,
    ticketPrice: price,
    priceText: text('priceText'),
    ticketUrl: text('ticketUrl'),
    saleTimes,
    note: text('note'),
    sourceUrl: text('sourceUrl'),
    imageUris: images,
    imageUri: images[0] || null
  };
}

/**
 * 演出 → 送審用的活動。只帶公開的活動資訊（名稱、藝人陣容、場地、城市、時間、票價、連結、開賣時間），
 * 不帶照片、座位、取票資訊、心得、評分、同行者、歌單。名稱與藝人都空白回 null。
 */
function concertToEventSubmission(c) {
  const fests = c.festivals || [];
  const seen = new Set();
  const lineup = [c.artistName, ...fests.filter((f) => !f.feat).map((f) => f.artistName)]
    .map((s) => String(s || '').trim()).filter((s) => s && !seen.has(s) && seen.add(s));
  const guests = {};
  for (const f of fests) {
    const n = String(f.artistName || '').trim(), host = String(f.featOf || '').trim();
    if (f.feat && n && host) guests[host] = [...new Set([...(guests[host] || []), n])];
  }
  const title = String(c.name || '').trim() || lineup[0] || '';
  if (!title) return null;
  const start = dateOf(c.dateTime);
  return {
    name: title, artistName: lineup.join(' / '), guestsByArtist: guests,
    venue: String(c.venue || '').trim(), city: String(c.city || '').trim() || null,
    dateTime: c.dateTime, endDate: c.endDate && c.endDate > start ? c.endDate : null, endTime: c.endTime || null,
    ticketPrice: typeof c.ticketPrice === 'number' && c.ticketPrice > 0 ? c.ticketPrice : null, priceText: null,
    ticketUrl: String(c.ticketUrl || '').split('\n').map((s) => s.trim()).find(Boolean) || null,
    note: null, sourceUrl: String(c.infoUrl || '').trim() || null,
    saleTimes: (c.saleTimes || []).filter((s) => s && s.at).slice()
      .sort((x, y) => String(x.at).localeCompare(String(y.at))),
    imageUri: null, imageUris: [], reviewComment: null, editOfId: null, status: 'pending'
  };
}

/**
 * 新增演出後自動送去「活動」頁審核（與 App 一致）。附帶動作、完全靜默：過去的場次、
 * 同一天已有相似名稱的活動（含自己送過、被駁回的）都略過；失敗也不影響演出本身的存檔。
 */
async function autoSubmitConcertAsEvent(c) {
  if (!user || !user.email || c.deletedAt) return;
  // 使用者可在「我的」關掉（與 App 共用同一個欄位）；直接讀雲端最新值，讀不到就丟例外＝不送。
  const ud = await getDoc(doc(db, 'users', user.uid));
  if (ud.exists() && ud.data().shareNewShowsToEvents === false) return;
  const sub = concertToEventSubmission(c);
  if (!sub) return;
  if ((sub.endDate || dateOf(sub.dateTime)) < todayLocal()) return;
  await loadEvents();
  if (findSimilarEvent(sub, [...allEvents, ...pendingEvents, ...myEvents])) return;
  const id = crypto.randomUUID();
  await setDoc(doc(db, 'free_events', id), { ...sub, id, createdBy: user.email, createdAt: Date.now() });
}

/** 審核：把投稿併入已公開的活動（補上缺的欄位與圖片），再刪掉投稿本身。 */
async function mergePendingInto(pending, target) {
  await setDoc(doc(db, 'free_events', target.id), mergeEventRecords(target, [pending]));
  await deleteDoc(doc(db, 'free_events', pending.id));
}

/**
 * 核准。修改提案要把內容**套回原活動**（沿用原 id / 投稿者 / 建立時間）再刪掉提案本身，
 * 否則清單上會同時留著原活動與提案兩筆。
 */
async function approvePending(e) {
  const targetId = String(e.editOfId || '').trim();
  if (targetId) {
    const original = allEvents.find((x) => x.id === targetId);
    if (!original) throw new Error('原活動已不存在，無法套用這筆修改');
    const applied = {
      ...e, id: targetId, status: 'approved', editOfId: null, reviewComment: null,
      createdBy: original.createdBy ?? null, createdAt: original.createdAt ?? Date.now()
    };
    await setDoc(doc(db, 'free_events', targetId), applied);
    await deleteDoc(doc(db, 'free_events', e.id));
  } else {
    await setDoc(doc(db, 'free_events', e.id), { status: 'approved', reviewComment: null }, { merge: true });
  }
}

/** 駁回：保留資料、狀態改 rejected，可附審核意見（投稿者看得到）。 */
async function rejectPending(e, comment) {
  await setDoc(doc(db, 'free_events', e.id),
    { status: 'rejected', reviewComment: comment || null }, { merge: true });
}

function reviewCardHtml(e) {
  const isEdit = !!String(e.editOfId || '').trim();
  const orig = isEdit ? allEvents.find((x) => x.id === e.editOfId) : null;
  let diffHtml = '';
  if (isEdit) {
    if (!orig) {
      diffHtml = '<div class="meta" style="color:var(--error)">原活動已不存在，核准會失敗。</div>';
    } else {
      const d = evDiff(e, orig);
      diffHtml = d.length
        ? '<div class="meta" style="margin-top:4px">' + d.map((x) =>
            `<div>${esc(x.label)}：${esc(x.from)} → <b>${esc(x.to)}</b></div>`).join('') + '</div>'
        : '<div class="meta" style="margin-top:4px">內容與原活動相同。</div>';
    }
  }
  // 新投稿：同一天已有名稱相似的公開活動就標出來，可以直接併進去。
  const sim = isEdit ? null : findSimilarEvent(e, allEvents);
  const simHtml = sim
    ? `<div class="meta" style="color:var(--error)">可能與已公開的「${esc(sim.name)}」（${esc(dateOf(sim.dateTime))}）重複</div>
       <button type="button" class="link" data-act="merge" data-target="${esc(sim.id)}" style="align-self:flex-start">併入現有活動</button>`
    : '';
  const sub = [dateOf(e.dateTime), e.artistName, [e.city, e.venue].filter(Boolean).join(' · ')]
    .filter(Boolean).join('　');
  return `<div class="rowitem" style="flex-direction:column;align-items:stretch;gap:6px" data-rv="${esc(e.id)}">
    <div class="t" style="display:flex;gap:8px;align-items:flex-start">
      <input type="checkbox" class="rv-check" data-id="${esc(e.id)}" checked
        style="width:18px;height:18px;flex:none;margin-top:3px;accent-color:var(--primary)">
      <div style="flex:1;min-width:0">
        <b>${esc(e.name || e.artistName || '未命名')}</b>
        <div class="meta">${esc(sub)}</div>
        <div class="meta">${isEdit ? '修改提案' : '新投稿'}${e.createdBy ? '・' + esc(e.createdBy) : ''}</div>
        ${diffHtml}
        ${simHtml}
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button type="button" class="btn" data-act="ok" style="flex:1">核准</button>
      <button type="button" class="btn ghost" data-act="no" style="flex:1">駁回</button>
    </div>
  </div>`;
}

/** 目前勾選（checkbox 打勾）的待審 id 清單。 */
function selectedReviewIds() {
  return [...document.querySelectorAll('#rvList .rv-check:checked')].map((el) => el.dataset.id);
}

/** 同步「全選」checkbox 的勾選狀態與「已選 X／共 Y」的文字。 */
function updateReviewSelCount() {
  const total = pendingEvents.length;
  const sel = selectedReviewIds().length;
  const countEl = $('#rvSelCount');
  if (countEl) countEl.textContent = `已選 ${sel}／共 ${total} 筆`;
  const allBox = $('#rvSelectAll');
  if (allBox) allBox.checked = total > 0 && sel === total;
}

/**
 * 對一批待審項目跑同一個動作（核准或駁回），逐筆送出、每 5 筆更新一次進度 toast——
 * 量一多（例如爬蟲一次進來幾百筆）逐筆點太累，這是「一鍵核准全部」的實作。
 * 單筆失敗不影響其他筆（例如某筆的原活動已被刪除，核准會拋錯）。
 */
async function runBulkReview(ids, action, label) {
  const items = ids.map((id) => pendingEvents.find((x) => x.id === id)).filter(Boolean);
  let done = 0, failed = 0;
  for (const e of items) {
    try { await action(e); done++; } catch (err) { failed++; }
    if ((done + failed) % 5 === 0 || done + failed === items.length) {
      toast(`${label}中… ${done + failed}／${items.length}`);
    }
  }
  await loadEvents();
  renderReviewList();
  render();
  toast(`已${label} ${done} 筆${failed ? `，${failed} 筆失敗` : ''}`);
}

function renderReviewList() {
  const box = $('#rvList');
  const bulk = $('#rvBulk');
  if (!box) return;
  if (!pendingEvents.length) {
    box.innerHTML = '<div class="empty">目前沒有待審核的活動。</div>';
    if (bulk) bulk.style.display = 'none';
    return;
  }
  box.innerHTML = pendingEvents.map(reviewCardHtml).join('');
  if (bulk) {
    bulk.style.display = '';
    bulk.innerHTML = `
      <div style="display:flex;align-items:center;gap:var(--sp-md);flex-wrap:wrap;
        padding-bottom:var(--sp-sm);border-bottom:1px solid var(--outline-variant)">
        <label style="display:flex;align-items:center;gap:6px;margin:0;text-transform:none;
          font-size:var(--t-body);letter-spacing:0;color:var(--on-surface);cursor:pointer">
          <input type="checkbox" id="rvSelectAll" checked style="width:18px;height:18px;accent-color:var(--primary)">
          全選
        </label>
        <span class="meta" id="rvSelCount" style="flex:1"></span>
        <button type="button" class="btn" id="rvApproveSel">核准已選</button>
        <button type="button" class="btn ghost" id="rvRejectSel">駁回已選</button>
      </div>`;
    $('#rvSelectAll').addEventListener('change', (ev) => {
      document.querySelectorAll('#rvList .rv-check').forEach((el) => { el.checked = ev.target.checked; });
      updateReviewSelCount();
    });
    $('#rvApproveSel').addEventListener('click', async () => {
      const ids = selectedReviewIds();
      if (!ids.length) { toast('先勾選要核准的項目'); return; }
      if (!confirm(`核准這 ${ids.length} 筆？核准後全部人都看得到，此動作無法一次復原。`)) return;
      await runBulkReview(ids, approvePending, '核准');
    });
    $('#rvRejectSel').addEventListener('click', async () => {
      const ids = selectedReviewIds();
      if (!ids.length) { toast('先勾選要駁回的項目'); return; }
      const c = prompt(`駁回這 ${ids.length} 筆的理由（可留空，會顯示給投稿者，套用同一個理由）：`, '');
      if (c === null) return;
      await runBulkReview(ids, (e) => rejectPending(e, c.trim() || null), '駁回');
    });
    updateReviewSelCount();
  }
  box.querySelectorAll('[data-rv]').forEach((el) => {
    const e = pendingEvents.find((x) => x.id === el.dataset.rv);
    if (!e) return;
    el.querySelector('[data-act="merge"]')?.addEventListener('click', async (ev) => {
      const target = allEvents.find((x) => x.id === ev.currentTarget.dataset.target);
      if (!target) { toast('原活動已不存在'); return; }
      if (!confirm(`把這筆投稿併入「${target.name}」？缺的欄位與圖片會補進去，投稿本身會刪掉。`)) return;
      try {
        await mergePendingInto(e, target);
        await loadEvents();
        renderReviewList();
        render();
        toast('已併入');
      } catch (err) { toast('合併失敗：' + err.message); }
    });
    el.querySelector('[data-act="ok"]').addEventListener('click', async () => {
      try {
        await approvePending(e);
        await loadEvents();
        renderReviewList();
        render();
        toast('已核准');
      } catch (err) { toast('核准失敗：' + err.message); }
    });
    el.querySelector('[data-act="no"]').addEventListener('click', async () => {
      const c = prompt('駁回理由（可留空，會顯示給投稿者）：', '');
      if (c === null) return;
      try {
        await rejectPending(e, c.trim() || null);
        await loadEvents();
        renderReviewList();
        render();
        toast('已駁回');
      } catch (err) { toast('駁回失敗：' + err.message); }
    });
  });
}

// 勾選框變動：委派在 #rvList 上一次性監聽（renderReviewList 每次重畫都會整個換掉裡面的節點，
// 監聽器不用重綁；綁在會被整個換掉的子節點上才需要每次重新綁）。

async function openReview() {

// ── 管理員：活動抓取來源 ─────────────────────────────────
async function renderCrawlSources() {
  const box = $('#cs_list');
  if (!box) return;
  box.innerHTML = '<div class="empty">載入中…</div>';
  let docs = [];
  try {
    const snap = await getDocs(collection(db, 'crawl_sources'));
    docs = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  } catch (e) { box.innerHTML = `<div class="empty">讀取失敗：${esc(e.message)}</div>`; return; }
  box.innerHTML = docs.length ? docs.map((s) => {
    const last = s.lastRunAt ? new Date(s.lastRunAt).toLocaleString() : '尚未抓取';
    return `<div class="rowitem" data-cs="${esc(s.id)}" style="flex-direction:column;align-items:stretch;gap:4px">
      <div class="t"><b style="word-break:break-all">${esc(s.label || s.url)}</b>
        <div class="meta" style="word-break:break-all">${esc(s.url)}</div>
        <div class="meta">${esc(s.type || 'auto')}・${s.active === false ? '已停用' : '啟用中'}・上次：${esc(last)}${s.lastCount != null ? '（' + s.lastCount + ' 筆）' : ''}</div>
      </div>
      <div style="display:flex;gap:12px">
        <button type="button" class="link" data-act="edit">編輯</button>
        <button type="button" class="link" data-act="toggle">${s.active === false ? '啟用' : '停用'}</button>
        <button type="button" class="danger" data-act="del">刪除</button>
      </div>
    </div>`;
  }).join('') : '<div class="empty">還沒有來源。加一個 .ics 或含活動資料的頁面網址。</div>';
  box.querySelectorAll('[data-cs]').forEach((el) => {
    const s = docs.find((x) => x.id === el.dataset.cs);
    el.querySelector('[data-act="edit"]')?.addEventListener('click', () => startEditSource(s));
    el.querySelector('[data-act="toggle"]')?.addEventListener('click', async () => {
      try { await setDoc(doc(db, 'crawl_sources', s.id), { active: !(s.active !== false) }, { merge: true }); renderCrawlSources(); }
      catch (e) { toast('更新失敗：' + e.message); }
    });
    el.querySelector('[data-act="del"]')?.addEventListener('click', async () => {
      if (!confirm('刪除這個來源？')) return;
      try { await deleteDoc(doc(db, 'crawl_sources', s.id)); if (csEditingId === s.id) cancelEditSource(); renderCrawlSources(); }
      catch (e) { toast('刪除失敗：' + e.message); }
    });
  });
}
