// ── 批次匯入 UI ──────────────────────────────────────────
let bkMode = 'csv';
let bkRows = [];
let bkBusy = false;
const bkSel = new Map();   // lineNumber -> 是否勾選

const bkExistingKeys = () => new Set(concerts.map((c) => BulkParse.dedupeKey(c)));

function bkSelectedConcerts() {
  return bkRows.filter((r) => r.concert && bkSel.get(r.lineNumber)).map((r) => r.concert);
}
function bkUpdateBtn() {
  const n = bkSelectedConcerts().length;
  const btn = $('#bkImport');
  btn.disabled = n === 0 || bkBusy;
  btn.textContent = bkBusy ? '匯入中…' : (n ? `匯入 ${n} 場` : '匯入');
}
function bkSyncMode() {
  $('#bkModeSeg').querySelectorAll('button').forEach((b) =>
    b.setAttribute('aria-pressed', String(b.dataset.mode === bkMode)));
  const lineup = bkMode === 'lineup';
  $('#bkHint').textContent = lineup
    ? '把整份卡司貼上，會依日期各建立一場音樂節，藝人自動拆分。同一天多位藝人，第一位當主秀。'
    : '一行一場、逗號分隔；本 App 匯出的 CSV 可直接貼上。最少只要「名稱或藝人」＋「日期」。';
  $('#bkLabel').textContent = lineup ? '貼上卡司名單' : '貼上清單 / CSV 內容';
  $('#bkText').placeholder = lineup
    ? '7/18：康士坦的變化球｜名譽伝説｜溫室雜草…'
    : '告五人巡迴,告五人,台北流行音樂中心,台北,台灣,2026-08-15 19:30';
  $('#bkExampleWrap').hidden = lineup;
  $('#bkExample').textContent =
    '欄位順序（後面可省略）：\n' + BulkParse.HEADER.join(', ') + '\n\n範例：\n' +
    '告五人巡迴,告五人,台北流行音樂中心,台北,台灣,2026-08-15 19:30\n' +
    '怕胖團,怕胖團,Legacy,台北,,2026/9/1';
}
function bkReparse() {
  const today = todayLocal();
  bkRows = bkMode === 'lineup'
    ? BulkParse.parseLineup($('#bkText').value, Number(today.slice(0, 4)), today)
    : BulkParse.parse($('#bkText').value);
  const keys = bkExistingKeys();
  bkSel.clear();
  bkRows.forEach((r) => { if (r.concert) bkSel.set(r.lineNumber, !keys.has(BulkParse.dedupeKey(r.concert))); });
  bkRenderList();
}
function bkRenderList() {
  const keys = bkExistingKeys();
  const valid = bkRows.filter((r) => r.concert);
  const dups = valid.filter((r) => keys.has(BulkParse.dedupeKey(r.concert)));
  const errs = bkRows.filter((r) => !r.concert);
  if (!bkRows.length) $('#bkSummary').textContent = '';
  else {
    let s = `可匯入 ${valid.length} 場`;
    if (dups.length) s += `，其中 ${dups.length} 場可能已存在，預設不勾選`;
    if (errs.length) s += `，${errs.length} 筆有問題`;
    $('#bkSummary').textContent = s;
  }
  $('#bkSelBar').hidden = !valid.length;
  $('#bkList').innerHTML = bkRows.map((r) => {
    if (!r.concert) {
      return `<div class="bk-row bk-err"><div class="bk-t"><b>第 ${r.lineNumber} 筆：${esc(r.error)}</b>` +
        `<div class="meta">${esc(r.raw)}</div></div></div>`;
    }
    const c = r.concert;
    const dup = keys.has(BulkParse.dedupeKey(c));
    const d = String(c.dateTime).slice(0, 10).split('-');
    const artists = [c.artistName, ...(c.festivals || []).map((x) => x.split('|')[3])].filter(Boolean);
    const sub = `${Number(d[1])}/${Number(d[2])}` + (c.venue ? '　' + c.venue : '') +
      ((c.name && c.artistName) || artists.length > 1 ? '　' + artists.join('、') : '');
    return `<label class="bk-row"><input type="checkbox" data-ln="${r.lineNumber}" ${bkSel.get(r.lineNumber) ? 'checked' : ''}>` +
      `<div class="bk-t"><b>${esc(c.name || c.artistName || '(未命名)')}</b><div class="meta">${esc(sub)}</div></div>` +
      (dup ? '<span class="bk-dup">可能已存在</span>' : '') + '</label>';
  }).join('');
  $('#bkList').querySelectorAll('input[data-ln]').forEach((el) =>
    el.addEventListener('change', () => { bkSel.set(Number(el.dataset.ln), el.checked); bkUpdateBtn(); }));
  bkUpdateBtn();
}
async function bkDoImport() {
  const list = bkSelectedConcerts();
  if (!list.length || bkBusy) return;
  bkBusy = true; bkUpdateBtn();
  let ok = 0;
  for (const c of list) {
    try { await saveConcert(c, null); ok++; } catch (e) { /* 單筆失敗就跳過，其餘照樣匯入 */ }
  }
  bkBusy = false;
  $('#bulkImport').close();
  $('#bkText').value = ''; bkRows = []; bkSel.clear();
  await loadConcerts();
  render();
  syncSocialAfterChange();
  toast(`已匯入 ${ok} 場，手機下次同步就會看到`);
}
function openBulkImport() {
  bkMode = 'csv'; bkBusy = false;
  $('#bkText').value = ''; bkRows = []; bkSel.clear();
  $('#bkExample').hidden = true; $('#bkExampleToggle').textContent = '看格式範例';
  bkSyncMode(); bkReparse();
  $('#bulkImport').showModal();
}

$('#bkModeSeg').querySelectorAll('button').forEach((b) =>

$('#bkText').addEventListener('input', bkReparse);
$('#bkExampleToggle').addEventListener('click', () => {

$('#bkSelNone').addEventListener('click', () => { bkSel.forEach((_, k) => bkSel.set(k, false)); bkRenderList(); });
$('#bkCancel').addEventListener('click', () => $('#bulkImport').close());

// Google 日曆「新增行程」網址（免 OAuth，開新分頁讓使用者確認）。
function gcalUrl(e) {
  const sd = new Date(String(e.dateTime).slice(0, 16));
  const ed = e.endTime ? new Date(dateOf(e.dateTime) + 'T' + String(e.endTime).slice(0, 5)) : new Date(sd.getTime() + 2 * 3600 * 1000);
  const end = ed > sd ? ed : new Date(sd.getTime() + 2 * 3600 * 1000);
  const f = (d) => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}T${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}00`;
  const p = new URLSearchParams({
    action: 'TEMPLATE',
    text: e.name || e.artistName || '活動',
    dates: `${f(sd)}/${f(end)}`,
    location: [e.city, e.venue].filter(Boolean).join(' '),
    details: [e.artistName, e.sourceUrl].filter(Boolean).join('\n')
  });
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}

/**
 * 從一段自由格式的文字裡揪出所有網址，並幫每個網址猜一個名稱——依據是
 * 「這個網址前面、上一個網址之後」那截文字（去掉常見的項目符號／分隔線）。
 * 不要求一行一個網址，貼一整段夾雜說明文字也能用；猜不出名稱就退回網域，
 * 之後可以用「編輯」改掉——不用整套規則猜到完美，反正貼完看得到、改得動。
 */
function extractUrlsWithLabels(text) {
  const urlRe = /https?:\/\/[^\s"'<>()　-〿＀-￯]+/gi;
  const matches = [...text.matchAll(urlRe)];
  const out = [];
  let cursor = 0;
  for (const m of matches) {
    const before = text.slice(cursor, m.index);
    cursor = m.index + m[0].length;
    // 名稱可能跟網址同一行（"TIX-GET-GO：https://…"）也可能在網址上一行
    // （"The Wall Live House\nhttps://…"）：取「網址前面最近的一段非空文字」都吃得到。
    let label = (before.split('\n').map((s) => s.trim()).filter(Boolean).pop() || '')
      .replace(/^[、,，\-–—・•|｜:：]+/, '')
      .replace(/[、,，\-–—・•|｜:：]+$/, '')
      .trim();
    const url = m[0].replace(/[.,、，)）\]】]+$/, '');   // 去掉黏在網址尾巴的標點
    if (!label) {
      try { label = new URL(url).hostname.replace(/^www\./, ''); } catch (e) { label = ''; }
    }
    out.push({ url, label });
  }
  return out;
}

$('#cs_bulk_add').addEventListener('click', async () => {
  const candidates = extractUrlsWithLabels($('#cs_bulk_text').value);
  if (!candidates.length) { toast('這段文字裡沒找到網址'); return; }
  // 跟現有來源比對網址，同一個網址不重複加（crawl_sources 的文件 id 是隨機 UUID，
  // 不比對的話貼兩次會建兩份來源，爬蟲會把同一頁抓兩次，白白浪費額度）。
  let existingUrls = new Set();
  try {
    const snap = await getDocs(collection(db, 'crawl_sources'));
    snap.forEach((d) => existingUrls.add(d.data().url));
  } catch (e) { /* 查不到就當作沒有既有來源，繼續往下加 */ }
  let added = 0, dup = 0, bad = 0;
  for (const { url, label } of candidates) {
    if (!/^https?:\/\//i.test(url)) { bad++; continue; }
    if (existingUrls.has(url)) { dup++; continue; }
    try {
      await setDoc(doc(db, 'crawl_sources', crypto.randomUUID()), {
        url, label: label || null, type: 'auto', active: true, createdAt: Date.now()
      });
      existingUrls.add(url);
      added++;
    } catch (e) { bad++; }
  }
  $('#cs_bulk_text').value = '';
  renderCrawlSources();
  const extra = [dup && `${dup} 筆已存在略過`, bad && `${bad} 筆寫入失敗`].filter(Boolean).join('、');
  toast(`批次新增完成：新增 ${added} 筆${extra ? '，' + extra : ''}（名稱猜錯的話點來源清單裡的「編輯」改）`);
});

const ART_SEP = /(?:[｜|、／;；\r\n　]|\x20{2,}|\s+\/\s+)+/;

  const set = new Set();
  const add = (raw) => String(raw || '').split(ART_SEP).map((s) => s.trim())
    .forEach((s) => { if (s) set.add(s); });
  concerts.forEach((c) => {
    add(c.artistName);

  });

    (e.artistName || '').split(' / ').forEach(add);
    Object.values(e.guestsByArtist || {}).flat().forEach(add);
  });
  return [...set].sort((a, b) => a.localeCompare(b, 'zh-Hant'));
}

  if (!box) return;
  box.innerHTML = evImages.map((img, i) =>
    `<div style="position:relative;width:80px;height:80px" data-imgidx="${i}">
       <img src="${esc(eventImgSrc(img))}" style="width:100%;height:100%;object-fit:cover;border-radius:8px">
       <button type="button" class="ev-img-rm" data-rm="${i}" title="移除"
         style="position:absolute;top:2px;right:2px;width:20px;height:20px;border:none;border-radius:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:1;cursor:pointer">✕</button>
     </div>`).join('');
  $('#g_imgLabel').textContent = `活動圖（${evImages.length} / ${MAX_EVENT_IMAGES}）`;
  $('#g_image').disabled = evImages.length >= MAX_EVENT_IMAGES;
  $('#g_paste').style.opacity = evImages.length >= MAX_EVENT_IMAGES ? '.4' : '';
}
$('#g_imgThumbs').addEventListener('click', (ev) => {
  const rm = ev.target.closest('[data-rm]'); if (!rm) return;
  evImages.splice(Number(rm.dataset.rm), 1);
  renderEventImages();
});

// 檔案 / 貼上都走這裡：壓縮成 Base64、加進 evImages（不超過上限），重畫縮圖。
async function addEventImageBlob(blob) {
  if (!blob) return false;
  if (evImages.length >= MAX_EVENT_IMAGES) { toast(`最多 ${MAX_EVENT_IMAGES} 張`); return false; }
  try {
    evImages.push(await encodeImage(blob));
    renderEventImages();
    return true;
  } catch {
    $('#g_imgPreview').textContent = '有一張圖片處理失敗，已略過';
    return false;
  }
}

$('#g_image').addEventListener('change', async (ev) => {
  const files = [...(ev.target.files || [])];
  $('#g_image').value = '';   // 清掉才能再選同一批
  for (const f of files) { if (!(await addEventImageBlob(f))) break; }
});

// 「貼上剪貼簿」按鈕：讀剪貼簿裡的圖片（需授權，某些瀏覽器 / http 不支援 → 提示改用 Ctrl+V）。
$('#g_paste').addEventListener('click', async () => {
  try {
    const items = await navigator.clipboard.read();
    for (const it of items) {
      const type = it.types.find((t) => t.startsWith('image/'));
      if (type) { await addEventImageBlob(await it.getType(type)); return; }
    }
    toast('剪貼簿裡沒有圖片');
  } catch {
    toast('無法讀取剪貼簿，改用 Ctrl/⌘+V 貼上試試');
  }
});

// Ctrl/⌘+V：活動編輯器開著時，貼上剪貼簿裡的圖片。
$('#evEditor').addEventListener('paste', (ev) => {
  const item = [...(ev.clipboardData?.items || [])].find((i) => i.type.startsWith('image/'));
  if (item) { ev.preventDefault(); addEventImageBlob(item.getAsFile()); }
});

// 活動藝人列：新增一列、移除一列（事件委派，動態列也適用）。
$('#g_addArtist').addEventListener('click', () => $('#g_artistRows').insertAdjacentHTML('beforeend', artistRowHtml('', '')));
$('#g_artistRows').addEventListener('click', (ev) => {
  const rm = ev.target.closest('.a-rm'); if (!rm) return;
  const box = $('#g_artistRows');
  if (box.children.length > 1) rm.closest('.art-row').remove();
  else rm.closest('.art-row').querySelectorAll('input').forEach((i) => (i.value = ''));
});

$('#evCancel').addEventListener('click', () => $('#evEditor').close());

$('#evDuplicate').addEventListener('click', () => {
  // 複製為新活動：把目前開著的內容當成一張「新的」——清掉編輯身分、改標題，欄位維持不動讓使用者改（例如換日期）再儲存。
  editingEvent = null;
  $('#evTitle').textContent = isCloudAdmin ? '新增活動' : '投稿活動';
  $('#evHint').textContent = isCloudAdmin ? '' : '投稿後需經管理員審核，通過後才會公開顯示。';
  // 原活動的圖不會跟著複製，清掉縮圖與提示才不會誤導（要圖再自己選 / 貼）。
  editingOwnSubmission = false;
  evImages = [];
  $('#g_imgPreview').textContent = '';
  renderEventImages();
  $('#evDuplicate').hidden = true;
  toast('已切換成新活動，改一改（例如日期）再按儲存');
});

$('#evSave').addEventListener('click', async () => {
  const name = $('#g_name').value.trim();
  const date = $('#g_date').value;
  if (!name || !date) { toast('活動名稱與日期是必填'); return; }
  const paid = $('#g_paidSeg button[data-paid="1"]').getAttribute('aria-pressed') === 'true';
  const priceText = paid ? $('#g_price').value.trim() : '';
  // 票價是自由文字，抓第一組數字給統計用；抓不到就以 -1 表示「要錢但金額未知」。
  const num = priceText.match(/\d[\d,]*/)?.[0]?.replace(/,/g, '');
  const endDate = $('#g_endDate').value;
  // 讀藝人列：主藝人 join " / "；每列的嘉賓拆成陣列，組成 guestsByArtist（分藝人 feat.）。
  const mains = [], guestsByArtist = {};
  [...$('#g_artistRows').querySelectorAll('.art-row')].forEach((r) => {
    const nm = r.querySelector('.a-name').value.trim();
    if (!nm) return;
    mains.push(nm);
    const gs = r.querySelector('.a-guests').value.split(/[、,，／/｜|;；\n]+/).map((s) => s.trim()).filter(Boolean);
    if (gs.length) guestsByArtist[nm] = gs;
  });
  try {
    const r = await saveEvent({
      name,
      artistName: mains.join(' / '),
      guestsByArtist,
      dateTime: `${date}T${$('#g_time').value || '00:00'}`,
      endDate: endDate && endDate > date ? endDate : null,
      endTime: $('#g_endTime').value || null,
      venue: $('#g_venue').value.trim(),
      city: $('#g_city').value.trim() || null,
      ticketPrice: paid ? (Number(num) > 0 ? Number(num) : -1) : null,
      priceText: paid ? (priceText || null) : null,
      ticketUrl: $('#g_ticketUrl').value.trim() || null,
      saleTimes: readSaleRows('#g_saleRows'),
      sourceUrl: $('#g_sourceUrl').value.trim() || null,
      note: $('#g_note').value.trim() || null,
      // imageUri（單張）同步成第一張，讓 App / 舊版與只讀單張的地方不會空白。
      imageUris: evImages.slice(),
      imageUri: evImages[0] || null
    }, editingEvent, editingOwnSubmission);
    $('#evEditor').close();
    await loadEvents();
    render();
    if ($('#mineDlg')?.open) renderMineList();   // 從「我的投稿」進來編輯的話，順手刷新那份清單
    toast(r.ownSubmission ? '已更新投稿'
      : r.approved ? '已新增'
      : r.proposal ? '修改已送出，待管理員審核'
      : '已送出投稿，待管理員審核');
  } catch (err) {
    // permission-denied 幾乎都是 Firestore 規則沒部署 / 不是管理員；把 code 帶出來好判斷。
    toast('儲存失敗：' + (err.code ? err.code + ' — ' : '') + err.message);
  }
});

// ── 滑動手勢 ─────────────────────────────────────────────
// App 的分頁與月曆都能左右滑，網頁也照做。
// 只在「水平位移明顯大於垂直」時才算換頁，否則會把正常的上下捲動吃掉——
// 這是手勢跟捲動打架最常見的原因。
const TAB_ORDER = ['shows', 'calendar', 'events', 'stats', 'profile'];

function attachSwipe(el, onLeft, onRight) {
  let x0 = null, y0 = null, locked = false;
  el.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; locked = false;
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    if (x0 == null || locked) return;
    const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
    // 垂直意圖較強 → 這一輪不再判定為換頁，讓捲動正常進行。
    if (Math.abs(dy) > Math.abs(dx)) { x0 = null; return; }
    if (Math.abs(dx) > 60) {
      locked = true;
      (dx < 0 ? onLeft : onRight)();
    }
  }, { passive: true });
  el.addEventListener('touchend', () => { x0 = null; }, { passive: true });
}

function gotoTab(name, dir) {
  const btn = document.querySelector(`button[data-tab="${name}"]`);
  if (btn) { swipeDir = dir; btn.click(); }
}
let swipeDir = null;

attachSwipe(document.querySelector('main'),
  () => { const i = TAB_ORDER.indexOf(tab); if (i < TAB_ORDER.length - 1) gotoTab(TAB_ORDER[i + 1], 'l'); },
  () => { const i = TAB_ORDER.indexOf(tab); if (i > 0) gotoTab(TAB_ORDER[i - 1], 'r'); });

// ── 分頁與登入 ───────────────────────────────────────────
$('#tabs').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  tab = b.dataset.tab;
  statDrill = null;   // 換分頁就退出鑽取，不然回統計時還卡在舊的篩選
  socialPage = null;  // 同理，換分頁要離開好友／排行榜／藝人等子頁
  viewingFriend = null;
  viewingArtist = null;
  $('#pageTitle').textContent = b.dataset.title;
  document.querySelectorAll('#tabs button').forEach((x) =>
    x.setAttribute('aria-selected', String(x === b)));
  // 管理員的「我的」要顯示待審核筆數，所以那頁也需要活動資料。
  if (!eventsLoaded && (tab === 'events' || (tab === 'profile' && isCloudAdmin))) {
    view.innerHTML = '<div class="empty">載入中…</div>';
    try { await loadEvents(); } catch (err) { toast('讀取活動失敗：' + err.message); }
  }
  render();
});

const signIn = () => signInWithPopup(auth, new GoogleAuthProvider()).catch((e) => toast('登入失敗：' + e.message));
$('#signInBtn').addEventListener('click', signIn);
$('#authBtn').addEventListener('click', () => (user ? signOut(auth) : signIn()));

onAuthStateChanged(auth, async (u) => {
  user = u;
  $('#authBtn').textContent = u ? '登出' : '登入';
  if (u) {
    view.innerHTML = '<div class="empty">載入中…</div>';
    await checkAdmin();
    try { await loadConcerts(); } catch (e) { toast('讀取失敗：' + e.message); }
    // 選歌一起載：連續天數要在選歌頁一進去就正確，事後補載會先閃一個 0。
    try { await loadSongs(); } catch (e) { toast('讀取選歌失敗：' + e.message); }
    try { await loadFollowed(); } catch { /* 追蹤清單讀不到就當成空的，不擋主流程 */ }
  } else {
    concerts = [];
    isCloudAdmin = false;
    // 待審核與我的投稿都含 email，登出就清掉，別留在下一個人的分頁裡。
    pendingEvents = [];
    myEvents = [];
    eventsLoaded = false;
    // 社群與選歌同理：都是這個帳號的私人資料，登出必須清掉。
    songs = []; songsLoaded = false;
    trashed = []; followedArtists = []; myNickname = null;
    friends = []; friendRequests = []; myHandle = null;
    socialLoaded = false; socialPage = null;
    viewingFriend = null; viewingArtist = null;
  }
  render();
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
